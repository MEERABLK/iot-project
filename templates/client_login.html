{% extends "components/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<body>
    {% include 'components/back_button.html' %}
    <div class="container">
        <h2>Login</h2>

        <form method="POST" action="{{ url_for('login') }}" class="collection collection-vertical collection-shade-1">
            
            <div class="collection collection-shade-2">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" required>
            </div>
            
            <div class="collection collection-shade-2">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="button">Log In</button>
            
            <!-- Separator -->
            <div style="text-align: center; margin: 10px 0; color: #888;">— OR —</div>

            <!-- Guest Button -->
            <a href="{{ url_for('checkout') }}" class="button" style="text-align: center; text-decoration: none; background-color: #666;">
                Continue as Guest
            </a>
            
            <p style="margin-top: 15px;">Don't have an account? <a href="{{ url_for('register') }}">Register here</a>.</p>
        </form>
    </div>
</body>
{% endblock %}
