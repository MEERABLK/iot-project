<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboard</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        a {
            color: white;
            text-decoration-line: none;
        }

        .container {
            display: flex;
            height: 100%;
            justify-content: center;
            align-items: center;

            background-color: #ffedd2;
        }

        .button {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            height: 100px;
            width: 100px;

            background-color: #ffe3bf;

            border-radius: 25px;
            
            transition: 0.2s ease;
        }

        .button:hover {
            background-color: #ffd8a4;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="fridges">
            <div class="button">
                Phase 2 - Fridges
            </div>
        </a>
    </div>
</body>
</html>
