{% extends "components/base.html" %}

{% block title %}Admin Panel{% endblock %}

{% block content %}
<body>

{% include 'components/back_button.html' %}

<div class="container">

    <h2>Admin Panel</h2>

    <div class="dashboard">
        <!-- ADD PRODUCT -->
        <div class="collection collection-vertical collection-shade-1">

            <h3>Add Product</h3>
            <div class="right-panel">
                <div id="messageBox" class="alert d-none"></div>
                <form id="addForm" class="form">
                    <input type="text" id="name" placeholder="Name" required>
                    <input type="text" id="category" placeholder="Category" required>
                    <input type="number" id="price" placeholder="Price" required>
                    
                    <input type="text" id="upc" placeholder=" UPC (Barcode)" required>
                    <input type="text" id="producer" placeholder="Producer" required>
                    <input type="number" id="quantity" placeholder="Quantity" required>
                
                
                    <input type="text" id="image" placeholder="Image URL">  
                    <button class="button" type="submit">Add</button>
                </form>

                <div class="collection collection-vertical collection-shade-3" id="editSection" style="display:none; margin-top:20px;">
                    <h3>Edit Product</h3>

                    <form id="editForm" class="form">
                        <input type="hidden" id="edit_id">

                        <input type="text" id="edit_name" placeholder="Name" required>
                        <input type="text" id="edit_category" placeholder="Category" required>
                        <input type="number" id="edit_price" placeholder="Price" required>

                        <input type="text" id="edit_upc" placeholder="UPC">

                        <input type="text" id="edit_producer" placeholder="Producer">
                        <input type="number" id="edit_quantity" placeholder="Quantity">
                        <input type="text" id="edit_image" placeholder="Image URL">
<div id="rfidEditor" class="rfid-editor"></div>

<div class="edit-actions">
    <button class="button" type="submit">Save Product Changes</button>
    <button type="button" class="button button-secondary" onclick="closeEdit()">Done / Close</button>
</div>                        
                    </form>
                </div>
            </div>
        </div>

        <div class="left-panel">
            <div class="collection collection-vertical collection-shade-2">

                <h3>Products</h3>

                <div id="productList" style="width:100%"></div>

            </div>
        </div>
    </div>

    <div class="collection collection-shade-3 collection-vertical">
        <h3>Reports</h3>
        <form method="get">
            <div class="collection collection-shade-1">
                <input type="date" id="start_date" name="start_date">
                <input type="date" id="end_date" name="end_date">
            </div>
            <div class="collection collection-shade-2">
                <button type="submit" formaction="{{ url_for('admin_inv_report') }}" class="button">
                    Inventory Report
                </button>
                <button type="submit" formaction="{{ url_for('admin_sales_report') }}" class="button">
                    Sales Report
                </button>
                <button type="submit"  formaction="{{ url_for('admin_customer_report') }}" class="button">
                    Customer Activity Report
                </button>
            </div>
        </form>
        
    </div>
</div>

<script>
let currentEditingProduct = null;

async function loadProducts() {
    const res = await fetch('/products');
    const data = await res.json();

    if (!res.ok) {
        showMessage(data.error || "Could not load products", "error");
        return;
    }

    const container = document.getElementById('productList');
    container.innerHTML = "";

    data.forEach(p => {
        const card = document.createElement('div');
        card.className = "product-card";

       const epcPreview = (p.epcs || []).slice(0, 3).map(epc => `
    <span class="admin-rfid-chip">${epc}</span>
`).join("");

const extraCount = (p.epcs || []).length > 3 
    ? `<span class="admin-rfid-chip admin-rfid-chip-more">+${(p.epcs || []).length - 3} more</span>` 
    : "";

card.innerHTML = `
<div class="admin-product-card-inner">
            <div class="admin-product-main">
            ${p.image ? `
                <img src="${p.image}" class="admin-product-img">
            ` : `
                <div class="admin-product-img admin-product-img-empty">No Image</div>
            `}

            <div class="admin-product-info">
                <div class="admin-product-title">${p.name}</div>
                <div class="admin-product-meta">${p.category || "No category"}</div>
                <div class="admin-product-meta"><b>UPC:</b> ${p.upc || "N/A"}</div>
                <div class="admin-product-stats">
                    <span>$${p.price}</span>
                    <span>Qty: ${p.quantity}</span>
                    <span>RFIDs: ${p.rfid_count}</span>
                </div>

                <div class="admin-rfid-preview">
                    ${epcPreview || `<span class="admin-rfid-empty">No RFID tags assigned</span>`}
                    ${extraCount}
                </div>
            </div>
        </div>

        <div class="admin-product-actions">
            <button class="button" onclick='openEdit(${JSON.stringify(p)})'>Manage</button>
            <button class="button button-danger" onclick="deleteProduct(${p.product_id})">Delete</button>
        </div>
    </div>
`;

        container.appendChild(card);
    });
}

function openEdit(p) {
    currentEditingProduct = p;

    document.getElementById("editSection").style.display = "block";

    document.getElementById("edit_id").value = p.product_id;
    document.getElementById("edit_name").value = p.name || "";
    document.getElementById("edit_category").value = p.category || "";
    document.getElementById("edit_price").value = p.price || "";
    document.getElementById("edit_upc").value = p.upc || "";
    document.getElementById("edit_producer").value = p.producer || "";
    document.getElementById("edit_quantity").value = p.quantity || 0;
    document.getElementById("edit_image").value = p.image || "";

    renderRfidEditor(p);
    document.getElementById("editSection").scrollIntoView({ behavior: "smooth" });
}

function closeEdit() {
    document.getElementById("editSection").style.display = "none";
    currentEditingProduct = null;
}

function safeId(text) {
    return String(text).replace(/[^a-zA-Z0-9]/g, "");
}

function renderRfidEditor(p) {
    const box = document.getElementById("rfidEditor");
    const epcs = p.epcs || [];

    box.innerHTML = `
        <div class="admin-rfid-panel">
            <div class="admin-rfid-panel-header">
                <div>
                    <h4>RFID / EPC Tags</h4>
                    <small>${epcs.length} tag(s) assigned to this product</small>
                </div>

                <button type="button" class="button button-secondary" onclick="closeEdit()">
                    Done / Close
                </button>
            </div>

            <div class="admin-rfid-add-row">
                <input type="text" id="new_manual_epc" placeholder="Enter EPC manually">
                <button type="button" class="button" onclick="addManualRfid()">Add Manual</button>
                <button type="button" class="button button-blue" onclick="scanNextTag()">Scan Tag</button>
            </div>

            <div id="scanStatus" class="admin-scan-status"></div>

            <div class="admin-rfid-list">
                ${
                    epcs.length
                    ? epcs.map(epc => {
                        const id = safeId(epc);
                        return `
                            <div class="admin-rfid-edit-row">
                                <input value="${epc}" id="rfid_${id}">
                                <button type="button" class="button" onclick="updateRfid('${epc}')">Save EPC</button>
                                <button type="button" class="button button-danger" onclick="deleteRfid('${epc}')">Delete</button>
                            </div>
                        `;
                    }).join("")
                    : `<div class="admin-rfid-empty-box">No RFID tags linked yet. Add manually or scan one.</div>`
                }
            </div>
        </div>
    `;
}

document.getElementById("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const product = {
        name: document.getElementById("name").value.trim(),
        category: document.getElementById("category").value.trim(),
        price: document.getElementById("price").value,
        upc: document.getElementById("upc").value.trim(),
        producer: document.getElementById("producer").value.trim(),
        quantity: document.getElementById("quantity").value,
        image: document.getElementById("image").value.trim()
    };

    const res = await fetch('/products', {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(product)
    });

    const data = await res.json();

    if (!res.ok) {
        showMessage(data.error || "Something went wrong", "error");
        return;
    }

    showMessage("Product added successfully", "success");
    e.target.reset();
    loadProducts();
});

document.getElementById("editForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const id = document.getElementById("edit_id").value;

    const updatedProduct = {
        name: document.getElementById("edit_name").value.trim(),
        category: document.getElementById("edit_category").value.trim(),
        price: parseFloat(document.getElementById("edit_price").value),
        upc: document.getElementById("edit_upc").value.trim(),
        producer: document.getElementById("edit_producer").value.trim(),
        quantity: parseInt(document.getElementById("edit_quantity").value) || 0,
        image: document.getElementById("edit_image").value.trim()
    };

    const res = await fetch(`/products/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(updatedProduct)
    });

    const data = await res.json();

    if (res.ok) {
        showMessage("Product updated successfully", "success");
        closeEdit();
        loadProducts();
    } else {
        showMessage(data.error || "Update failed", "error");
    }
});

async function addManualRfid() {
    if (!currentEditingProduct) return;

    const input = document.getElementById("new_manual_epc");
    const epc = input.value.trim();

    if (!epc) {
        showMessage("Enter an EPC first", "error");
        return;
    }

    const res = await fetch(`/products/${currentEditingProduct.product_id}/rfids`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ epc })
    });

    const data = await res.json();

    if (res.ok) {
        showMessage("RFID added manually", "success");
        await refreshCurrentProduct();
    } else {
        showMessage(data.error || "Could not add RFID", "error");
    }
}

async function updateRfid(oldEpc) {
    if (!currentEditingProduct) return;

    const input = document.getElementById(`rfid_${safeId(oldEpc)}`);
    const newEpc = input.value.trim();

    const res = await fetch(`/products/${currentEditingProduct.product_id}/rfids/${encodeURIComponent(oldEpc)}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ epc: newEpc })
    });

    const data = await res.json();

    if (res.ok) {
        showMessage("RFID updated", "success");
        await refreshCurrentProduct();
    } else {
        showMessage(data.error || "Could not update RFID", "error");
    }
}

async function deleteRfid(epc) {
    if (!currentEditingProduct) return;

    const res = await fetch(`/products/${currentEditingProduct.product_id}/rfids/${encodeURIComponent(epc)}`, {
        method: "DELETE"
    });

    const data = await res.json();

    if (res.ok) {
        showMessage("RFID deleted", "success");
        await refreshCurrentProduct();
    } else {
        showMessage(data.error || "Could not delete RFID", "error");
    }
}

async function scanNextTag() {
    if (!currentEditingProduct) return;

    const status = document.getElementById("scanStatus");
    status.innerHTML = "Waiting for RFID scan...";

    const res = await fetch(`/products/${currentEditingProduct.product_id}/scan-next-tag`, {
        method: "POST"
    });

    const data = await res.json();

    if (!res.ok) {
        showMessage(data.error || "Could not start scan mode", "error");
        status.innerHTML = "";
        return;
    }

    showMessage("Scan the RFID tag now", "success");

    let tries = 0;
    const interval = setInterval(async () => {
        tries++;

        await refreshCurrentProduct(false);

        if (tries >= 6) {
            clearInterval(interval);
            status.innerHTML = "Scan check finished. If tag did not appear, scan again.";
        }
    }, 1000);
}

async function refreshCurrentProduct(showMsg = true) {
    const res = await fetch('/products');
    const products = await res.json();

    const updated = products.find(p => p.product_id === currentEditingProduct.product_id);

    if (updated) {
        currentEditingProduct = updated;
        renderRfidEditor(updated);
        loadProducts();

        if (showMsg) {
            showMessage("Updated", "success");
        }
    }
}

async function deleteProduct(id) {
    const res = await fetch(`/products/${id}`, {
        method: "DELETE"
    });

    if (res.ok) {
        showMessage("Product deleted", "success");
        closeEdit();
        loadProducts();
    } else {
        showMessage("Could not delete product", "error");
    }
}

function showMessage(text, type) {
    const box = document.getElementById("messageBox");

    box.innerText = text;
    box.classList.remove("msg-success", "msg-error");

    if (type === "error") {
        box.classList.add("msg-error");
    } else {
        box.classList.add("msg-success");
    }

    box.style.display = "block";

    setTimeout(() => {
        box.innerText = "";
        box.classList.remove("msg-success", "msg-error");
        box.style.display = "none";
    }, 3000);
}

loadProducts();
</script>

</body>
</html>
 {% endblock %}
